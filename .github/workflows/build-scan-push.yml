name: build-scan-push
on:
  workflow_call:
   inputs:
    image: {type: string, required: true}
    context: {type: string, default: .}
    dockerfile: {type: string, default: "Dockerfile"}
    push: {type: boolean, default: false}
   outputs:
    tag:
     description: "Image tag that was built"
     value: ${{ jobs.build.outputs.tag}}
  
jobs:
  build:
   runs-on: ubuntu-latest
   permissions:
    contents: read
    packages: write
   outputs:
    tag: ${{github.sha}}
   steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
       context: ${{inputs.context}}
       file: ${{inputs.context}}/${{inputs.dockerfile}}
       load: true
       tags: ${{inputs.image}}:${{github.sha}}
       cache-from: type=gha,scope=${{inputs.image}}
       cache-to: type=gha,mode=max,scope=${{ inputs.image }}
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
       image-ref: ${{inputs.image}}:${{github.sha}}
       severity: CRITICAL,HIGH
       ignore-unfixed: true
       exit-code: '1'
    - if: inputs.push
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
       registry: ghcr.io
       username: ${{github.actor}}
       password: ${{secrets.GITHUB_TOKEN}}
    - if: inputs.push
      run: docker push ${{inputs.image}}:${{github.sha}}
     